# Override de produção — troca as imagens oficiais pelas do fork ewh-custom.
#
# Uso na VPS (junto do compose existente em /opt/plane-be):
#   docker compose --env-file plane.env -p plane-be \
#     -f docker-compose.yml -f docker-compose.ewh.yml pull
#   docker compose --env-file plane.env -p plane-be \
#     -f docker-compose.yml -f docker-compose.ewh.yml up -d
#
# Rollback: repetir o `up -d` SEM o segundo -f (volta às imagens oficiais).
# Fixe um tag ewh-<sha> em vez de ewh-latest para deploys reproduzíveis.

services:
  web:
    image: ghcr.io/amigosdacoluna/plane-frontend:ewh-latest
  space:
    image: ghcr.io/amigosdacoluna/plane-space:ewh-latest
  admin:
    image: ghcr.io/amigosdacoluna/plane-admin:ewh-latest
  live:
    image: ghcr.io/amigosdacoluna/plane-live:ewh-latest
  api:
    image: ghcr.io/amigosdacoluna/plane-backend:ewh-latest
    environment:
      EWH_BUSINESS_TZ: America/Sao_Paulo
  worker:
    image: ghcr.io/amigosdacoluna/plane-backend:ewh-latest
    environment:
      EWH_BUSINESS_TZ: America/Sao_Paulo
  beat-worker:
    image: ghcr.io/amigosdacoluna/plane-backend:ewh-latest
    environment:
      EWH_BUSINESS_TZ: America/Sao_Paulo
  migrator:
    image: ghcr.io/amigosdacoluna/plane-backend:ewh-latest
