name: EWH · Build de imagens customizadas

# Builda as imagens do fork (amd64, para a VPS) e publica no GHCR.
# Dispara em push na branch ewh-custom ou manualmente.
on:
  push:
    branches: [ewh-custom]
    paths-ignore:
      - "easyworkhub-docs/**"
      - "**.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plane-frontend
            dockerfile: ./apps/web/Dockerfile.web
          - name: plane-backend
            dockerfile: ./apps/api/Dockerfile.api
          - name: plane-admin
            dockerfile: ./apps/admin/Dockerfile.admin
          - name: plane-space
            dockerfile: ./apps/space/Dockerfile.space
          - name: plane-live
            dockerfile: ./apps/live/Dockerfile.live
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:ewh-latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
